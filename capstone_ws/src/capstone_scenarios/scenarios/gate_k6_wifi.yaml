# RF_Swarm demo2 Run B — multi-protocol variant (WiFi tier, column formation).
# Same geometry/clock as gate_k6* — only rf: (protocol physics, NOISE_MODEL.md §8)
# and rff: (real WiSig unit_ids) differ. Story: proves the RFFP router correctly
# identifies a non-BLE tier from real IQ and the WiFi frozen encoder (wisig_frozen.pt,
# T-B) actually engages — the router isn't decorative.
scenario_id: gate_k6_wifi

k: 6                        # gate at K=6 (full STGT template; no subsetting)
formation_label: column     # multi-protocol story variant (same geometry/clock as gate_k6_column)
spread: 1.0                 # scales get_formation_offsets
seed: 7                     # reproducibility for dispersed/converging RNG
duration_s: 60.0            # trajectory clamps (holds) after this; sim keeps running

# Fixed base-station TDoA array (ENU metres). Z-diverse on purpose: 4 corners at
# a 90 m footprint (two raised to 35 m) + one elevated centre at 70 m, so the
# vertical axis is observable and GDOP stays ~1.2–1.8 across the whole traversal.
receivers:
  - [ 90.0,  90.0,  0.0]
  - [-90.0,  90.0, 35.0]
  - [-90.0, -90.0,  0.0]
  - [ 90.0, -90.0, 35.0]
  - [  0.0,   0.0, 70.0]

# Swarm centroid path. Rigid formation: every emitter = centroid + its offset,
# all sharing the centroid velocity. Stays inside the array footprint.
trajectory:
  type: constant_velocity
  start:    [-30.0, 0.0, 50.0]
  velocity: [  1.0, 0.0,  0.0]

# --- RF observable + receiver-noise model (pre-registered; see NOISE_MODEL.md §8) ---
rf:
  protocol: wifi            # 802.11 tier: ~20 MHz OFDM ch @ 2.4 GHz
  carrier_hz: 2.4e+9
  bandwidth_hz: 20.0e+6      # occupied 802.11 channel; CRLB uses B_rms = bandwidth/sqrt(12)
  sample_rate_hz: 25.0e+6    # WiSig capture rate (RFF PROTO_NATIVE wifi tier)
  window_samples: 256        # WiSig window (RFF PROTO_NATIVE); T = 256/25e6 = 10.24 us -> sigma_fdoa
  path_loss_exponent: 2.2    # outdoor near-LOS (matches RFF demo_router/geometry.py; protocol-agnostic)
  rssi_ref_dbm_at_1m: -30.0  # reused adopted scale (§2/§8) — no more-traceable per-protocol TX power exists
  noise_figure_db: 6.0
  rssi_shadow_sigma_db: 3.5
  cfo_ppm: 31.25             # RFF-traceable: wisig_manytx.py CFO_MAX=0.003 cyc/sample @25MS/s @2.4GHz (§8)
  burst_rate_hz: 2.0         # per emitter
clock:                       # per-receiver nuisance state (DISCIPLINED-array residual) — unchanged from gate_k6
  bias_max_ns: 30.0
  drift_max_ns_per_s: 0.3
  bias_sigma_ns: 30.0

# --- fingerprint binding (capstone_rff) — real WiSig IQ, ~/CAPSTONE/DL_model ---
# unit_ids screened (2026-08-28) for mutual separability in the 512-D T-B embedding space AND
# clean 'wifi' routing: greedy search over 16 real WiSig tx ids (2 more — 10-10, 12-1 — were
# excluded, they route 'unknown' via the OOD gate, not 'wifi'). Worst-pair cosine 0.689
# (< MERGE_TAU 0.85 — an unscreened 6-id pick had worst-pair 0.918, would have merged in K-est).
rff:
  embedding_pool: n/a                                  # unused field (capstone_rff streams IQ directly)
  unit_ids: ['1-1', '1-11', '12-7', '13-7', '10-4', '10-1']
  windows_per_obs: 8                                   # real WiFi windows pooled per (burst, rx)
